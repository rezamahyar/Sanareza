name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -q -o "$ZIP" -d .
          else
            echo "No zip found, continuing"
          fi
          ls -la

      - name: Locate Flutter project
        run: |
          PUB=$(find . -maxdepth 4 -name pubspec.yaml -not -path '*/.*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$PUB" ]; then
            echo "::error::pubspec.yaml not found in repo. Repo contains:"
            ls -laR | head -n 100
            exit 1
          fi
          DIR=$(dirname "$PUB")
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $DIR"
          if [ ! -f "$DIR/lib/main.dart" ]; then
            echo "::error::$DIR/lib/main.dart is missing"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Bootstrap Android platform folders
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create --platforms=android --org com.hybridai --project-name hybrid_ai_app .
          rm -rf test
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:label="Hybrid AI"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST_EOF
          echo "Manifest applied"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze (non-fatal)
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Rename & collect artifact
        run: |
          mkdir -p release
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             release/hybrid-ai-app-${{ github.run_number }}.apk
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-ai-app-apk-${{ github.run_number }}
          path: release/hybrid-ai-app-${{ github.run_number }}.apk
          retention-days: 30
